---
layout: main
---

<main class="project">
	<section id="project-content">
		<!-- Project Video -->
		<div class="video-container">
			<video id="project-video" class="responsive-video" autoplay loop muted>
				<source src="{{ page.video }}" type="video/mp4">
				Your browser does not support the video tag.
			</video>
		</div>
		
		<!-- Project Title and Date -->
		<h1 id="project-title">{{ page.title }}</h1>
		<h2 id="project-date">{{ page.date | date: '%B %-d, %Y' }}</h2>

		<!-- Content and Skills Section (Flexbox layout) -->
		<div id="project-details">
			<!-- Project Description -->
			<div id="content">
				{{ content }}
			</div>

			<!-- Skills Panel -->
			{% if page.skills %}
			<section id="skills-panel">
				<h3>Skills Used</h3>
				<ul>
					{% for skill in page.skills %}
					<li>{{ skill }}</li>
					{% endfor %}
				</ul>
			</section>
			{% endif %}
		</div>

		<!-- Project Repository Link -->
        {% if page.repo %}
		<section id="github-link">
			<a href="{{ page.repo }}" target="_blank" id="github-repo-link">
				<img src="/public/images/github-logo.png" alt="GitHub Logo" class="github-logo">
				View the GitHub Repo
			</a>
		</section>
		{% endif %}
	</section>
</main>

<style>
	/* Set light blue background for the page */
	body {
		background-color: #e6f7ff;  /* Light blue background */
		font-family: Arial, sans-serif;
		margin: 0;
		padding: 0;
	}

	/* Center only the video */
	.video-container {
		text-align: center;  /* Center the video container */
		margin-bottom: 30px;  /* Add more space below the video */
	}

	.responsive-video {
		width: 100%;
		max-width: 600px;  /* Limit maximum width to 600px for a smaller video */
		height: auto;  /* Maintain aspect ratio */
		border-radius: 8px;
		box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
	}

	#project-content {
		max-width: 1200px;
		margin: 0 auto;
		padding: 20px;
	}

	#project-title {
		font-size: 2.8em;
		color: #2c3e50;  /* Dark color for the title */
		margin-top: 20px;
		margin-bottom: 10px;
		text-align: center;  /* Center the title */
	}

	#project-date {
		font-size: 1.2em;
		color: #7f8c8d;  /* Light grey color for the date */
		text-align: center;  /* Center the date */
		margin-bottom: 30px;  /* Add gap below the date */
	}

	/* Flexbox Layout for Description and Skills Panel */
	#project-details {
		display: flex; /* Creates a flex container */
		flex-wrap: wrap; /* Allows items to wrap on smaller screens */
		justify-content: space-between; /* Spreads items across the container */
		gap: 30px; /* Adds space between the description and skills panel */
	}

	#content {
		flex: 1 1 60%; /* Content section takes up 60% of the space */
	}

	#skills-panel {
		flex: 1 1 20%; /* Skills panel now takes up 20% of the space (smaller) */
		background-color: #ffffff;  /* White background for the skills panel */
		border: 1px solid #ddd;
		border-radius: 8px;
		padding: 10px;  /* Reduced padding to make the box smaller */
		box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
		height: fit-content;
		width: fit-content;
	}

	/* Section Title Styling */
	h3 {
		font-size: 1.8em;  /* Smaller font size for the section title */
		color: #e74c3c;  /* Red color for section titles */
		border-bottom: 2px solid #e74c3c;
		padding-bottom: 5px;
		margin-bottom: 15px;
	}

	#skills-panel ul {
		list-style-type: disc;  /* Default bullet points */
		padding-left: 20px;  /* Indentation for bullets */
		margin-left: 0;  /* Remove any default margin */
		display: block; /* Makes the skills appear vertically */
	}

	#skills-panel ul li {
		font-size: 1em;  /* Adjust font size for skill items */
		color: #2c3e50;  /* Dark color for skill items */
		margin-bottom: 6px;  /* Space between skills */
	}

	/* Add spacing between sections like Overview and How to Play */
	#content > h2 {
		margin-top: 20px;
		color: #3498db;  /* Bright blue color for secondary headings */
	}

	#content > p {
		margin-bottom: 20px;
		color: #34495e;  /* Darker grey for paragraph text */
		line-height: 1.6;  /* Improve readability with better line height */
	}

	/* Styling for the repository link section */
	/* GitHub Link Styling */
	#github-link {
		text-align: center;
		margin-top: 20px;  /* Add margin to separate from other sections */
	}

	#github-repo-link {
		font-size: 1.2em;  /* Smaller font size for the link */
		color: #333;
		text-decoration: none;
		display: inline-flex;
		align-items: center;
		justify-content: center;
	}

	.github-logo {
		width: 20px;
		height: 20px;
		margin-right: 10px;
	}

	#github-repo-link:hover {
		color: #2c3e50;
	}

	/* Ensure skills panel and content stack on smaller screens */
	@media (max-width: 768px) {
		#skills-panel {
			float: none; /* Skills panel should not float on smaller screens */
			width: 100%;  /* Full width on small screens */
			margin-left: 0;  /* Remove left margin */
			margin-top: 20px;  /* Space between content and skills panel */
		}

		#content {
			clear: none; /* No need to clear floats on small screens */
		}
	}
</style>
